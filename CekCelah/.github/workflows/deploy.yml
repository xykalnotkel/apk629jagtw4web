name: Deploy to Vercel

# Auto-deploy ke Vercel setiap kali push ke main.
#
# CARA SETUP:
# 1. Buka https://vercel.com/account/tokens -> buat token (copy)
# 2. Buka repo di GitHub -> Settings -> Secrets and variables -> Actions
# 3. Tambahkan 3 repository secrets:
#      VERCEL_TOKEN   = token dari langkah 1
#      VERCEL_ORG_ID  = ambil dari `npx vercel link` di lokal (file .vercel/project.json)
#      VERCEL_PROJECT_ID = sama seperti di atas
# Setelah itu setiap push ke main akan otomatis deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'CekCelah/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    defaults:
      run:
        working-directory: CekCelah

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: CekCelah/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

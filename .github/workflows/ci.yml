name: CI - Next.js Build & Type Check

on:
  push:
    paths:
      - 'CekCelah/src/**'
      - 'CekCelah/package.json'
      - 'CekCelah/package-lock.json'
      - 'CekCelah/tsconfig.json'
      - 'CekCelah/next.config.js'
      - 'CekCelah/tailwind.config.ts'
      - 'CekCelah/postcss.config.js'
      - 'CekCelah/public/**'
      - 'CekCelah/backend/scanner.cpp'
      - '.github/workflows/ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'CekCelah/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: CekCelah/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund
        working-directory: CekCelah

      - name: Ensure C++ binary
        run: |
          if [ ! -x backend/cekcelah-scanner ]; then
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends g++
            g++ -std=c++20 -O2 -static -static-libgcc -static-libstdc++ \
                -o backend/cekcelah-scanner backend/scanner.cpp
            chmod +x backend/cekcelah-scanner
          fi
          file backend/cekcelah-scanner
        working-directory: CekCelah

      - name: Type check
        run: npx tsc --noEmit
        working-directory: CekCelah

      - name: Build Next.js
        run: npm run build
        working-directory: CekCelah
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: CekCelah/.next
          retention-days: 3

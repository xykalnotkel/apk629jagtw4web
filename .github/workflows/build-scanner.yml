name: Build C++ Scanner

# Workflow ada di repo-root .github/workflows. Tidak memakai defaults.run.working-directory
# agar perintah git add/push dijalankan dari repo root. Build step tetap 'cd CekCelah'.

on:
  push:
    paths:
      - 'CekCelah/backend/scanner.cpp'
      - '.github/workflows/build-scanner.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Test C++ Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install g++
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends g++ file
          g++ --version | head -1

      - name: Compile static binary
        run: |
          cd CekCelah
          g++ -std=c++20 -O2 \
              -static -static-libgcc -static-libstdc++ \
              -o backend/cekcelah-scanner \
              backend/scanner.cpp
          chmod +x backend/cekcelah-scanner
          ls -la backend/
          file backend/cekcelah-scanner

      - name: Verify static linking
        run: |
          cd CekCelah
          file backend/cekcelah-scanner
          echo "--- ldd (must show not a dynamic executable) ---"
          ldd backend/cekcelah-scanner 2>&1 || true
          echo "--- size ---"
          du -h backend/cekcelah-scanner

      - name: Smoke test
        run: |
          cd CekCelah
          ./backend/cekcelah-scanner example.com > /tmp/scan.out
          head -20 /tmp/scan.out
          if grep -q "^HOST" /tmp/scan.out && grep -q "^CHECK" /tmp/scan.out && grep -q "^DONE" /tmp/scan.out; then
            echo "Smoke test PASSED"
          else
            echo "FAILED"
            exit 1
          fi

      - name: Commit binary back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CekCelah/backend/cekcelah-scanner
          if git diff --cached --quiet; then
            echo "Binary unchanged, nothing to commit."
          else
            git commit -m "chore(scanner): rebuild C++ static binary [skip ci]"
            git push
            echo "Binary pushed."
          fi
